<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCraftHub: Your Learning Management Platform</title>
    <style>
      :root {
        --primary: #8B5CF6;
        --primary-dark: #7C3AED;
        --primary-light: #A78BFA;
        --success: #F59E0B;
        --error: #EF4444;
        --bg: #F5F3FF;
        --card: #ffffff;
        --text: #1F2937;
        --muted: #6B7280;
        --border: #E5E7EB;
        --shadow: 0 4px 14px rgba(139, 92, 246, 0.08);
        --shadow-lg: 0 12px 32px rgba(139, 92, 246, 0.18);
        --radius: 12px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
      }

      header {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: #fff;
        padding: 2.5rem 1.5rem;
        text-align: center;
        box-shadow: var(--shadow-lg);
      }
      header h1 { font-size: 1.9rem; font-weight: 700; line-height: 1.2; }
      header p { margin-top: 0.5rem; opacity: 0.9; font-size: 0.95rem; }

      main {
        max-width: 1100px;
        margin: 2rem auto;
        padding: 0 1rem;
      }

      .panel {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .panel h2 {
        color: var(--primary-dark);
        font-size: 1.2rem;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
      }
      .form-grid .full { grid-column: 1 / -1; }

      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 0.3rem;
      }
      input, textarea, select {
        width: 100%;
        padding: 0.6rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.95rem;
        font-family: inherit;
        background: #fff;
        color: var(--text);
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
      }
      textarea { resize: vertical; min-height: 80px; }
      input.invalid, textarea.invalid, select.invalid { border-color: var(--error); }

      .btn {
        border: none;
        border-radius: 8px;
        padding: 0.65rem 1.25rem;
        font-size: 0.95rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: transform 0.1s, opacity 0.2s, background 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
      .btn:active { transform: translateY(1px); }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }
      .btn-primary { background: var(--primary); color: #fff; }
      .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
      .btn-success { background: var(--success); color: #fff; }
      .btn-success:hover:not(:disabled) { background: #D97706; }
      .btn-danger { background: var(--error); color: #fff; }
      .btn-danger:hover:not(:disabled) { background: #DC2626; }
      .btn-ghost { background: transparent; color: var(--primary); border: 1px solid var(--border); }
      .btn-ghost:hover:not(:disabled) { background: var(--bg); }

      .actions { margin-top: 1rem; display: flex; gap: 0.75rem; flex-wrap: wrap; }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .toolbar .count { color: var(--muted); font-size: 0.9rem; }
      .refresh-btn { font-size: 0.85rem; padding: 0.45rem 0.85rem; }

      .table-wrap { overflow-x: auto; }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 640px;
      }
      th, td {
        text-align: left;
        padding: 0.85rem 0.75rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.9rem;
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: #FAFAFE;
      }
      tbody tr { transition: background 0.15s; }
      tbody tr:hover { background: #FDFCFF; }
      .course-name { font-weight: 600; color: var(--text); }
      .course-desc { color: var(--muted); font-size: 0.85rem; max-width: 280px; }
      .course-date { white-space: nowrap; color: var(--muted); }

      .badge {
        display: inline-block;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        white-space: nowrap;
      }
      .badge.Not\\ Started { background: #F3F4F6; color: #4B5563; }
      .badge.In\\ Progress { background: #FEF3C7; color: #92400E; }
      .badge.Completed { background: #D1FAE5; color: #065F46; }

      .row-actions { display: flex; gap: 0.4rem; white-space: nowrap; }
      .icon-btn {
        border: none;
        border-radius: 6px;
        padding: 0.4rem 0.6rem;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s, background 0.2s;
      }
      .icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .icon-btn.edit { background: var(--primary); color: #fff; }
      .icon-btn.edit:hover:not(:disabled) { background: var(--primary-dark); }
      .icon-btn.del { background: var(--error); color: #fff; }
      .icon-btn.del:hover:not(:disabled) { background: #DC2626; }

      /* spinner */
      .spinner {
        width: 18px; height: 18px;
        border: 2px solid rgba(255,255,255,0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: inline-block;
      }
      .spinner.dark {
        border: 2px solid rgba(139,92,246,0.2);
        border-top-color: var(--primary);
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .state {
        text-align: center;
        padding: 2.5rem 1rem;
        color: var(--muted);
      }

      .toast-wrap {
        position: fixed;
        top: 1rem; right: 1rem;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-width: calc(100vw - 2rem);
      }
      .toast {
        padding: 0.85rem 1.1rem;
        border-radius: 10px;
        color: #fff;
        font-size: 0.9rem;
        font-weight: 500;
        box-shadow: var(--shadow-lg);
        animation: slidein 0.25s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .toast.success { background: var(--success); }
      .toast.error { background: var(--error); }
      @keyframes slidein { from { transform: translateX(120%); opacity: 0; } }

      /* modal */
      .overlay {
        position: fixed; inset: 0;
        background: rgba(31, 41, 55, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 1rem;
      }
      .overlay.open { display: flex; }
      .modal {
        background: #fff;
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
        width: 100%;
        max-width: 480px;
        padding: 1.5rem;
        animation: pop 0.2s ease;
      }
      @keyframes pop { from { transform: scale(0.96); opacity: 0; } }
      .modal h3 { color: var(--primary-dark); margin-bottom: 1rem; }
      .modal .field { margin-bottom: 1rem; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; }

      @media (max-width: 640px) {
        header h1 { font-size: 1.4rem; }
        main { margin: 1rem auto; }
        .panel { padding: 1.1rem; }
      }
    </style>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <header>
      <h1>CodeCraftHub: Your Learning Management Platform</h1>
      <p>Plan, track, and complete your learning journey</p>
    </header>

    <main>
      <section class="panel" id="formPanel">
        <h2>Add New Course</h2>
        <form id="courseForm" novalidate>
          <div class="form-grid">
            <div class="full">
              <label for="name">Course Name *</label>
              <input type="text" id="name" name="name" placeholder="e.g. Advanced JavaScript" />
            </div>
            <div class="full">
              <label for="description">Description *</label>
              <textarea id="description" name="description" placeholder="What will you learn?"></textarea>
            </div>
            <div>
              <label for="target_date">Target Date *</label>
              <input type="date" id="target_date" name="target_date" />
            </div>
            <div>
              <label for="status">Status *</label>
              <select id="status" name="status">
                <option value="Not Started">Not Started</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
          </div>
          <div class="actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">Add Course</button>
            <button type="reset" class="btn btn-ghost">Clear</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="toolbar">
          <h2 style="margin:0">Your Courses</h2>
          <div style="display:flex;align-items:center;gap:1rem">
            <span class="count" id="countLabel"></span>
            <button class="btn btn-ghost refresh-btn" id="refreshBtn">Refresh</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Course</th>
                <th>Target Date</th>
                <th>Status</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="courseBody"></tbody>
          </table>
        </div>
        <div id="stateBox"></div>
      </section>
    </main>

    <!-- edit modal -->
    <div class="overlay" id="editOverlay">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
        <h3 id="editTitle">Edit Course</h3>
        <form id="editForm" novalidate>
          <input type="hidden" id="editId" />
          <div class="field">
            <label for="editName">Course Name *</label>
            <input type="text" id="editName" />
          </div>
          <div class="field">
            <label for="editDescription">Description *</label>
            <textarea id="editDescription"></textarea>
          </div>
          <div class="field">
            <label for="editDate">Target Date *</label>
            <input type="date" id="editDate" />
          </div>
          <div class="field">
            <label for="editStatus">Status *</label>
            <select id="editStatus">
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="cancelEdit">Cancel</button>
            <button type="submit" class="btn btn-success" id="saveEditBtn">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <div class="toast-wrap" id="toasts"></div>

    <script>
      // Base API URL — points at the deployed backend (courses edge function).
      const API_BASE = "https://glitwpygintiyxymwypq.supabase.co/functions/v1/courses";

      const STATUSES = ["Not Started", "In Progress", "Completed"];

      const $ = (sel) => document.querySelector(sel);
      const tbody = $("#courseBody");
      const stateBox = $("#stateBox");
      const countLabel = $("#countLabel");

      /* ---------- toast notifications ---------- */
      function toast(message, type = "success") {
        const el = document.createElement("div");
        el.className = "toast " + type;
        el.textContent = message;
        $("#toasts").appendChild(el);
        setTimeout(() => {
          el.style.transition = "opacity .3s, transform .3s";
          el.style.opacity = "0";
          el.style.transform = "translateX(120%)";
          setTimeout(() => el.remove(), 300);
        }, 3200);
      }

      /* ---------- helpers ---------- */
      function formatDate(value) {
        if (!value) return "—";
        const d = new Date(value);
        if (isNaN(d)) return "—";
        return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      }

      function statusBadge(status) {
        const safe = String(status).replace(/\s/g, "\\ ");
        return `<span class="badge ${safe}">${status}</span>`;
      }

      function showState(html) {
        tbody.innerHTML = "";
        stateBox.innerHTML = html;
      }

      function showLoading(msg) {
        showState(`<div class="state"><span class="spinner dark"></span><div style="margin-top:.75rem">${msg}</div></div>`);
      }

      function showEmpty() {
        showState(`<div class="state">No courses yet. Add your first course above.</div>`);
      }

      function showError(msg) {
        showState(`<div class="state" style="color:var(--error)">⚠ ${msg}</div>`);
      }

      function escapeHtml(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[c]);
      }

      function clearInvalid(form) {
        form.querySelectorAll(".invalid").forEach((el) => el.classList.remove("invalid"));
      }

      function validateForm(form, fields) {
        clearInvalid(form);
        let ok = true;
        for (const f of fields) {
          const el = form.querySelector(f.selector);
          const val = (el.value || "").trim();
          if (!val) {
            el.classList.add("invalid");
            ok = false;
          }
        }
        if (!ok) toast("Please fill in all required fields.", "error");
        return ok;
      }

      /* ---------- API layer ---------- */
      async function api(method, path = "", body = null) {
        const url = path ? `${API_BASE}/${path}` : API_BASE;
        const opts = { method, headers: { "Content-Type": "application/json" } };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(url, opts);
        let data = null;
        try { data = await res.json(); } catch (_) {}
        if (!res.ok) {
          throw new Error((data && data.error) || `Request failed (${res.status})`);
        }
        return data;
      }

      /* ---------- render ---------- */
      let allCourses = [];

      function render() {
        countLabel.textContent = allCourses.length
          ? `${allCourses.length} course${allCourses.length > 1 ? "s" : ""}`
          : "";
        if (!allCourses.length) { showEmpty(); return; }
        stateBox.innerHTML = "";
        tbody.innerHTML = allCourses.map((c) => `
          <tr data-id="${c.id}">
            <td>
              <div class="course-name">${escapeHtml(c.name)}</div>
              <div class="course-desc">${escapeHtml(c.description)}</div>
            </td>
            <td class="course-date">${escapeHtml(c.target_date)}</td>
            <td>${statusBadge(c.status)}</td>
            <td class="course-date">${formatDate(c.created_at)}</td>
            <td>
              <div class="row-actions">
                <button class="icon-btn edit" data-act="edit">Edit</button>
                <button class="icon-btn del" data-act="del">Remove</button>
              </div>
            </td>
          </tr>
        `).join("");
      }

      async function fetchCourses() {
        showLoading("Loading courses...");
        try {
          allCourses = await api("GET");
          render();
        } catch (err) {
          showError(err.message);
          toast("Failed to load courses.", "error");
        }
      }

      /* ---------- create ---------- */
      $("#courseForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.target;
        if (!validateForm(form, [
          { selector: "#name" },
          { selector: "#description" },
          { selector: "#target_date" },
        ])) return;

        const payload = {
          name: $("#name").value.trim(),
          description: $("#description").value.trim(),
          target_date: $("#target_date").value,
          status: $("#status").value,
        };

        const btn = $("#submitBtn");
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Adding...';
        try {
          const created = await api("POST", "", payload);
          allCourses.unshift(created);
          render();
          form.reset();
          toast("Course added successfully.");
        } catch (err) {
          toast(err.message, "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "Add Course";
        }
      });

      /* ---------- row actions (edit / delete) ---------- */
      tbody.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-act]");
        if (!btn) return;
        const row = btn.closest("tr");
        const id = row.dataset.id;
        if (btn.dataset.act === "del") {
          if (!confirm("Remove this course? This cannot be undone.")) return;
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner" style="width:12px;height:12px"></span>';
          try {
            await api("DELETE", id);
            allCourses = allCourses.filter((c) => c.id !== id);
            render();
            toast("Course removed.");
          } catch (err) {
            toast(err.message, "error");
            render();
          }
        } else if (btn.dataset.act === "edit") {
          const course = allCourses.find((c) => c.id === id);
          if (course) openEdit(course);
        }
      });

      /* ---------- edit modal ---------- */
      const overlay = $("#editOverlay");

      function openEdit(c) {
        $("#editId").value = c.id;
        $("#editName").value = c.name;
        $("#editDescription").value = c.description;
        $("#editDate").value = c.target_date;
        $("#editStatus").value = c.status;
        clearInvalid($("#editForm"));
        overlay.classList.add("open");
        $("#editName").focus();
      }

      function closeEdit() { overlay.classList.remove("open"); }

      $("#cancelEdit").addEventListener("click", closeEdit);
      overlay.addEventListener("click", (e) => { if (e.target === overlay) closeEdit(); });

      $("#editForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.target;
        if (!validateForm(form, [
          { selector: "#editName" },
          { selector: "#editDescription" },
          { selector: "#editDate" },
        ])) return;

        const id = $("#editId").value;
        const payload = {
          name: $("#editName").value.trim(),
          description: $("#editDescription").value.trim(),
          target_date: $("#editDate").value,
          status: $("#editStatus").value,
        };

        const btn = $("#saveEditBtn");
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Saving...';
        try {
          const updated = await api("PUT", id, payload);
          allCourses = allCourses.map((c) => (c.id === id ? updated : c));
          render();
          closeEdit();
          toast("Course updated successfully.");
        } catch (err) {
          toast(err.message, "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "Save Changes";
        }
      });

      /* ---------- refresh ---------- */
      $("#refreshBtn").addEventListener("click", fetchCourses);

      /* ---------- init ---------- */
      fetchCourses();
    </script>
  </body>
</html>
